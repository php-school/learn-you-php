name: LearnYouPhp

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo_sqlite, sockets
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-progress

      - name: Build runtime image
        run: docker build -t phpunit-runtime .docker/runtime

      - name: Run phpunit tests (docker)
        run: PROCESS_FACTORY=docker vendor/bin/phpunit --stop-on-error

      - name: Run phpunit tests (host)
        run: PROCESS_FACTORY=host vendor/bin/phpunit --stop-on-error

      - name: Run phpcs
        run: composer cs

      - name: Run phpstan
        run: composer static

      - name: Install with workshop-manager (PR)
        if: github.ref != 'refs/heads/master'
        run: |
          curl -O https://php-school.github.io/workshop-manager/workshop-manager.phar
          chmod +x workshop-manager.phar
          ./workshop-manager.phar install learnyouphp ${{ github.head_ref }} ${{github.event.pull_request.head.repo.html_url}}
          ./workshop-manager.phar installed

      - name: Install with workshop-manager (push)
        if: github.ref == 'refs/heads/master'
        run: |
          curl -O https://php-school.github.io/workshop-manager/workshop-manager.phar
          chmod +x workshop-manager.phar
          ./workshop-manager.phar install learnyouphp master
          ./workshop-manager.phar installed
